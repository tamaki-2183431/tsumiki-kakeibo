<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1f2b26">
<title>つみき家計簿</title>
<style>
:root{
  --bg:#eef1ee; --surface:#ffffff; --surface2:#f7f9f7;
  --ink:#1f2b26; --sub:#68766f; --faint:#9aa8a0;
  --line:#dde4df; --line2:#e9eeea;
  --asset:#1e6e5c; --asset-soft:#e3efe9; --asset-ink:#134f42;
  --spend:#b4543e; --spend-soft:#f6e8e3;
  --income:#2f6d8e; --income-soft:#e4eef4;
  --warn:#9a6b2f; --warn-soft:#f7efe2;
  --danger:#b03a2e; --danger-soft:#f6e2df;
  --ok:#3c7d4e;
  --r:14px; --r-s:9px;
  --shadow:0 1px 2px rgba(31,43,38,.06),0 4px 14px rgba(31,43,38,.05);
  --nav-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 12px;width:100%;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--asset);outline-offset:1px;border-color:var(--asset)}
input.num{text-align:right;font-variant-numeric:tabular-nums}
input[type="date"]{min-height:46px;-webkit-appearance:none;appearance:none;font-variant-numeric:tabular-nums}
label{display:block;font-size:12px;color:var(--sub);margin:12px 0 4px;font-weight:600;letter-spacing:.02em}
label .req{color:var(--spend)}
header.app{
  position:sticky;top:0;z-index:30;background:var(--ink);color:#f2f5f3;
  padding:10px 16px calc(10px);display:flex;align-items:baseline;gap:10px;
}
header.app .brand{font-size:17px;font-weight:700;letter-spacing:.06em}
header.app .brand small{font-weight:500;font-size:11px;color:#aebbb4;margin-left:8px;letter-spacing:.08em}
header.app .mini-price{margin-left:auto;font-size:12px;color:#cfe0d8;font-variant-numeric:tabular-nums;white-space:nowrap}
header.app .mini-price b{font-size:13px}
header.app .mini-price .src{font-size:10px;color:#8fa39a}
main{max-width:640px;margin:0 auto;padding:14px 14px 24px}
.screen{display:none}
.screen.on{display:block}
/* tab bar */
nav.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--surface);border-top:1px solid var(--line);display:flex;
}
nav.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;color:var(--sub);padding-top:7px;
}
nav.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabbar button.on{color:var(--asset);font-weight:700}
/* cards & text */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--asset-soft);color:var(--asset-ink)}
.card h3{font-size:13px;margin:14px 0 6px;color:var(--sub)}
.hint{font-size:11.5px;color:var(--sub)}
.warnbox{background:var(--warn-soft);border:1px solid #e6d5b8;border-radius:var(--r-s);padding:10px 12px;font-size:12px;color:var(--warn);margin-top:10px}
.dangerbox{background:var(--danger-soft);border:1px solid #e7c4bf;border-radius:var(--r-s);padding:10px 12px;font-size:12px;color:var(--danger);margin-top:10px}
.notebox{background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r-s);padding:10px 12px;font-size:12px;color:var(--sub);margin-top:10px}
.errbox{background:var(--danger-soft);border:1px solid #e7c4bf;border-radius:var(--r-s);padding:10px 12px;font-size:12.5px;color:var(--danger);margin:8px 0}
.okbox{background:var(--asset-soft);border:1px solid #cfe2d9;border-radius:var(--r-s);padding:10px 12px;font-size:12.5px;color:var(--asset-ink);margin:8px 0}
/* big number rows */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.stat .l{font-size:11.5px;color:var(--sub)}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .v small{font-size:12px;font-weight:600;color:var(--sub);margin-left:2px}
.stat .s{font-size:10.5px;color:var(--faint);margin-top:2px}
.v.spend{color:var(--spend)} .v.income{color:var(--income)} .v.asset{color:var(--asset)}
.v.plus{color:var(--ok)} .v.minus{color:var(--danger)}
/* stacked bricks gauge (signature) */
.gauge{margin:6px 0 4px}
.gauge .strip{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--line2)}
.gauge .brick{height:100%;background:var(--asset);border-right:2px solid var(--surface);opacity:.92;min-width:4px;transition:width .4s ease}
.gauge .brick:last-child{border-right:none}
.gauge .brick.alt{background:#3a8a75}.gauge .brick.alt2{background:#5aa68f}
.gauge .empty{height:100%;flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--faint)}
.gauge .cap{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:5px;font-variant-numeric:tabular-nums}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:13px 18px;font-weight:700;font-size:14.5px;border:1px solid transparent;min-height:46px}
.btn.primary{background:var(--asset);color:#fff}
.btn.primary:active{opacity:.85}
.btn.sub{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.warn{background:#fff;border-color:#e6d5b8;color:var(--warn)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.inrow{display:flex;gap:8px;align-items:flex-end}
/* segmented tabs */
.seg{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line2);border-radius:11px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--sub);font-weight:600}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line2)}
.lrow:last-child{border-bottom:none}
.lrow .ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700}
.lrow .ico.exp{background:var(--spend-soft);color:var(--spend)}
.lrow .ico.inc{background:var(--income-soft);color:var(--income)}
.lrow .ico.buy{background:var(--asset-soft);color:var(--asset-ink)}
.lrow .ico.sell{background:var(--warn-soft);color:var(--warn)}
.lrow .mid{flex:1;min-width:0}
.lrow .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .d{font-size:11.5px;color:var(--sub)}
.lrow .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lrow .amt small{font-weight:600;color:var(--sub)}
.lrow .ops{display:flex;gap:6px}
.mut{color:var(--faint)}
/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{font-size:10.5px;color:var(--sub);font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
table.tbl td{padding:7px 4px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;vertical-align:top}
table.tbl td.r,table.tbl th.r{text-align:right}
/* copy cards */
.copycard{border:1.5px solid var(--asset);background:var(--asset-soft);border-radius:var(--r);padding:12px 14px;margin-top:10px}
.copycard .l{font-size:11.5px;color:var(--asset-ink);font-weight:700}
.copycard .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ink);word-break:break-all}
.copycard button{margin-top:6px}
.copycard.plain{border-color:var(--line);background:var(--surface)}
/* price header */
.pricebar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.pricebar .now{flex:1 1 130px}
.pricebar .now .v{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.pill.ok{background:var(--asset-soft);color:var(--asset-ink)}
.pill.ng{background:var(--danger-soft);color:var(--danger)}
.pill.fb{background:var(--warn-soft);color:var(--warn)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
/* chart */
.chart{width:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;font-size:11.5px;color:var(--sub)}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.bar{height:8px;border-radius:5px;background:var(--asset);min-width:2px}
.barslot{display:flex;align-items:center;gap:8px;margin:7px 0}
.barslot .nm{width:88px;font-size:12px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barslot .barwrap{flex:1;background:var(--line2);border-radius:5px;height:8px;overflow:hidden}
.barslot .amt{width:84px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;flex-shrink:0}
/* modal */
#modal-root{position:fixed;inset:0;z-index:100;display:none}
#modal-root.on{display:block}
#modal-root .veil{position:absolute;inset:0;background:rgba(31,43,38,.45)}
#modal-root .box{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:640px;max-height:88vh;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#modal-root .box h2{font-size:16px;margin-bottom:10px;padding-right:38px}
#modal-root .mclose{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--surface2);border:1px solid var(--line2);color:var(--sub);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
#modal-root .mclose:active{opacity:.7}
body.modal-open{overflow:hidden}
#modal-root .grip{width:40px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 12px}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:120;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw}
#toast.on{opacity:.95}
/* misc */
.mt{margin-top:12px}.mb0{margin-bottom:0}.small{font-size:12px}
.checkline{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--sub);margin:6px 0}
.checkline input{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.kv{display:flex;justify-content:space-between;gap-10px;padding:7px 2px;border-bottom:1px dashed var(--line2);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--sub)}
.kv .v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;word-break:break-all}
.bigmoney{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* home input hub */
.actgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigact{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:var(--r);padding:16px 10px;font-weight:700;font-size:14.5px;text-align:center;min-height:88px;border:1px solid transparent;box-shadow:var(--shadow)}
.bigact svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bigact .s{font-size:10.5px;font-weight:500;opacity:.8}
.bigact.main{background:var(--asset);color:#fff;grid-column:1 / -1;min-height:106px;font-size:16.5px;box-shadow:none}
.bigact.sub{background:var(--surface);border-color:var(--line)}
.bigact.sub svg{stroke:var(--asset)}
/* two-column form row */
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow2>div{min-width:0}
/* TSV preview */
.tsvrow{padding:9px 2px;border-bottom:1px solid var(--line2);font-size:12.5px}
.tsvrow:last-child{border-bottom:none}
.tsvrow .t{font-weight:600;font-size:13.5px}
.tsvrow .d{color:var(--sub);font-size:11.5px;margin-top:1px;word-break:break-all}
.tsvrow .amt{font-weight:700;font-variant-numeric:tabular-nums}
.tsvrow.fx{background:var(--warn-soft);border-radius:8px;padding-left:8px;padding-right:8px}
/* help page */
header.app .hdr-help{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.35);color:#cfe0d8;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;margin-left:10px}
header.app .hdr-help:active{opacity:.7}
.steps .st{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line2);align-items:flex-start}
.steps .st:last-child{border-bottom:none}
.steps{counter-reset:st}
.steps .st::before{counter-increment:st;content:counter(st);flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--asset-soft);color:var(--asset-ink);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
/* drag handle */
.lrow .drag{cursor:grab;color:var(--faint);font-size:15px;font-weight:700;padding:10px 8px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;flex-shrink:0;letter-spacing:-1px;line-height:1}
.lrow.dragging{opacity:.55;background:var(--surface2);border-radius:8px;box-shadow:0 0 0 1px var(--asset);position:relative;z-index:5}
/* --- XRPタブ(サイクル管理) --- */
.cyc .head{display:flex;align-items:center;gap:8px}
.cyc .head .name{font-size:13px;font-weight:700}
.cyc{position:relative}
.cyc .badgeline{margin-bottom:6px}
.xbtn{position:absolute;top:6px;right:8px;width:32px;height:32px;border:0;background:transparent;color:var(--sub);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;padding:0}
.xbtn:active{background:var(--bg)}
.buyord{padding-top:13px;padding-bottom:13px}
.buyord .pair{margin-top:3px}
.buyord .progressbar{margin-top:6px}
.lrow.tap{cursor:pointer}
.seclab{display:block;font-size:12px;color:var(--sub);margin:16px 0 8px;font-weight:700}
.seclab small{font-weight:400;opacity:.8}
.cmp{display:grid;grid-template-columns:1fr 88px 72px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--surface2);cursor:pointer}
.cmp:active{opacity:.7}
.cmN{font-size:13px;font-weight:600;margin-bottom:4px}
.cmC{font-size:11px;color:var(--sub);font-weight:400;margin-left:2px}
.cmpbar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:3px}
.cmpbar i{display:block;height:100%;border-radius:3px}
.cmA{font-size:13px;font-weight:700;text-align:right;white-space:nowrap}
.cmP{font-size:10px;color:var(--sub);text-align:right;white-space:nowrap;margin-top:2px}
.dlt{font-size:12px;font-weight:700;text-align:right;white-space:nowrap}
.dltp{font-size:10px;font-weight:400;opacity:.8}
.tip{background:var(--surface2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.tip .t{font-size:13px;font-weight:700}
.tip .d{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.55}
.chart rect.seg{cursor:pointer}
.chart rect.seg:active{opacity:.75}
.lgd{cursor:pointer}
.lgd:active{opacity:.7}
.lgdwrap{flex-wrap:wrap;gap:6px 14px;font-size:11px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--surface2);font-size:13px}
.kv span{color:var(--sub);white-space:nowrap}
.kv b{text-align:right;word-break:break-word}
.srch{margin:2px 0 8px}
.prow{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--surface2)}
.lrow.tap:active{background:var(--surface2)}
.qa{display:flex;flex-direction:column;gap:8px}
.qa details{border:1px solid var(--line2);border-radius:10px;background:var(--surface2);padding:10px 12px}
.qa details[open]{background:var(--surface)}
.qa summary{cursor:pointer;list-style:none;display:flex;align-items:flex-start;font-weight:700;font-size:13.5px;line-height:1.5}
.qa summary::-webkit-details-marker{display:none}
.qa summary::before{content:'Q';color:var(--asset);font-weight:800;margin-right:8px;flex-shrink:0}
.qa summary::after{content:'＋';margin-left:auto;padding-left:10px;color:var(--sub);font-weight:700;flex-shrink:0}
.qa details[open] summary::after{content:'−'}
.qa .a{margin-top:8px;padding-left:22px;font-size:12.5px;line-height:1.7;color:var(--sub)}
.qa .a b{color:var(--ink);font-weight:600}
.cyc .head .name{flex:1 1 auto;min-width:0}
.cyc .head .amt{margin-left:auto;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cyc .pair{display:flex;gap:12px;font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;flex-wrap:wrap;margin-top:5px}
.cyc .pair b{color:var(--ink);font-weight:600}
.badge{font-size:10px;font-weight:700;border-radius:20px;padding:2px 9px;flex-shrink:0}
.b-sell{background:var(--asset-soft);color:var(--asset)}
.b-buy{background:#f6ecd9;color:var(--warn)}
.b-done{background:var(--bg);color:var(--sub)}
.progressbar{height:7px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:8px}
.progressbar i{display:block;height:100%;background:var(--asset);border-radius:6px}
.after{display:flex;align-items:baseline;justify-content:space-between;font-size:11.5px;margin-top:5px}
.after .left{color:var(--warn);font-weight:700;font-variant-numeric:tabular-nums}
.after .diff{color:var(--asset);font-weight:700;font-variant-numeric:tabular-nums}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.lrow.selrow .chk{background:var(--asset);border-color:var(--asset)}
.lrow.selrow{outline:1.5px solid var(--asset);outline-offset:-1.5px;border-radius:10px;background:var(--surface2)}
.lrow.drop-above{box-shadow:0 -2px 0 0 var(--asset)}
.lrow.drop-below{box-shadow:0 2px 0 0 var(--asset)}
/* prompt example */
.promptbox{background:#f4f6f4;border:1px solid var(--line2);border-radius:var(--r-s);padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--ink);margin-top:8px}
.steps .st .b{font-weight:600;font-size:13.5px}
.steps .st .d{font-size:12px;color:var(--sub);margin-top:1px}
div.errskip{display:none}
</style>
</head>
<body>
<header class="app">
  <div class="brand">つみき<small>家計 × 資産ノート</small></div>
  <div class="mini-price" id="mini-price" style="display:none"></div>
  <button class="hdr-help" onclick="go('help')" aria-label="アプリの使い方">?</button>
</header>
<main id="main">
  <section class="screen" id="scr-home"></section>
  <section class="screen" id="scr-ledger"></section>
  <section class="screen" id="scr-history"></section>
  <section class="screen" id="scr-asset"></section>

'use strict';
/* ================= コア計算ロジック(純粋関数・DOM非依存) ================= */
const Core = (() => {

  const YEN = 1; // 金額は円(整数)で管理

  function round(n, d = 0) {
    const p = Math.pow(10, d);
    return Math.sign(n) * Math.round(Math.abs(n) * p + Number.EPSILON) / p;
  }
  // ステップ(刻み幅)の小数桁数を得る
  function stepDecimals(step) {
    const s = String(step);
    const i = s.indexOf('.');
    return i < 0 ? 0 : s.length - i - 1;
  }
  // 数値を step の倍数に切り下げ(stepは正の10進文字列) — 浮動小数誤差は相対許容で吸収
  function stepCount(x, step) {
    const c = x / Number(step);
    const r = Math.round(c);
    return Math.abs(c - r) < 1e-9 * Math.max(1, Math.abs(c)) ? r : Math.floor(c);
  }
  function floorStep(x, step) {
    return round(stepCount(x, step) * Number(step), stepDecimals(step));
  }
  function ceilStep(x, step) {
    const f = floorStep(x, step);
    if (f >= x - 1e-9 * Math.max(1, Math.abs(x))) return f;
    return round(f + Number(step), stepDecimals(step));
  }
  // 購入数量 = 購入金額 ÷ 注文レート (最小注文単位に切り下げ)
  function calcBuyQty(amount, rate, minOrderQty, qtyStep) {
    const raw = amount / rate;
    const qty = floorStep(raw, qtyStep);
    return { qty, ok: qty >= Number(minOrderQty) - 1e-9 && qty > 0 };
  }
  // 売却目標価格 = 実際の購入価格 × (1 + 上昇率) → 価格刻みに丸め(切上げ)
  function calcTargetPrice(rate, gainRate, priceStep) {
    const raw = rate * (1 + gainRate);
    return ceilStep(raw, priceStep);
  }
  // 元本回収に必要な売却数量 = 元本 ÷ 売却目標価格 (数量刻みに切り下げ)
  function calcSellQty(principal, targetPrice, minOrderQty, qtyStep) {
    const qty = floorStep(principal / targetPrice, qtyStep);
    return { qty, ok: qty >= Number(minOrderQty) - 1e-9 && qty > 0 };
  }
  // 残存数量(刻み丸り後)
  function remainingQty(totalQty, sellQty) {
    const d = Math.max(stepDecimals('0.00000001'), 0);
    return round(totalQty - sellQty, 8);
  }
  // 購入登録時の紐づけ: 未購入(reserves)を古い順に消化
  // actualAmount: 実際の購入金額(円) → {links:[{reserveId, amount}], remainder: 差額}
  function allocatePurchase(reserves, actualAmount) {
    let rest = Math.round(actualAmount);
    const links = [];
    for (const r of reserves) {
      if (rest <= 0) break;
      const take = Math.min(r.amount, rest);
      if (take > 0) links.push({ reserveId: r.id, amount: take, txId: r.txId });
      rest -= take;
    }
    return { links, remainder: rest }; // remainder>0: 予定より多く買った分 / links合計<actual は無い
  }
  // 購入金額(予定)に対し実際が不足した場合の残り未購入額
  // plannedTotal: 紐づけ対象だった予定合計, actualAmount: 実際
  function shortfallOf(plannedTotal, actualAmount) {
    return Math.max(0, Math.round(plannedTotal) - Math.round(actualAmount));
  }
  // FIFO: 購入lotsと累計売却数量から未売却lotsを計算
  // purchases: [{id, datetime, qty, rate}] 昇順ソート済み, soldTotal: 数量
  function fifoRemaining(purchases, soldTotal) {
    let rest = soldTotal;
    const out = [];
    for (const p of purchases) {
      const q = Number(p.qty);
      let remain = q;
      if (rest > 0) {
        const use = Math.min(q, rest);
        remain = round(q - use, 8);
        rest = round(rest - use, 8);
      }
      if (remain > 1e-9) out.push({ purchaseId: p.id, qty: remain, rate: Number(p.rate), datetime: p.datetime });
    }
    return out;
  }
  // 売却のFIFO割当 + 実現損益(手数料を引いた額)
  // purchases昇順, sale:{qty, amountJPY, fee}
  function fifoAllocateSale(purchases, sale) {
    let rest = Number(sale.qty);
    let cost = 0;
    const alloc = [];
    for (const p of purchases) {
      if (rest <= 0) break;
      const remain = Number(p.remainQty != null ? p.remainQty : p.qty); // 呼び出し側で残数量を渡す
      if (remain <= 0) continue;
      const use = Math.min(remain, rest);
      cost += use * Number(p.rate);
      alloc.push({ purchaseId: p.id, qty: round(use, 8) });
      rest = round(rest - use, 8);
    }
    const realized = round(Number(sale.amountJPY) - Number(sale.fee || 0) - cost);
    return { alloc, cost: round(cost), realized };
  }
  // 月サマリ
  function monthSummary(txs, ym) { // ym: 'YYYY-MM'
    let exp = 0, inc = 0;
    for (const t of txs) {
      if (String(t.date).slice(0, 7) !== ym) continue;
      if (t.type === 'expense') exp += t.amount; else inc += t.amount;
    }
    return { expense: exp, income: inc, balance: inc - exp };
  }
  // 日別サマリ(その月の全日)
  function dayTotals(txs, ym) { // ym: 'YYYY-MM' → [{day, date, expense, income, balance, count}]
    const [y, m] = ym.split('-').map(Number);
    const last = new Date(y, m, 0).getDate();
    const days = [];
    for (let d = 1; d <= last; d++) days.push({ day: d, date: ym + '-' + String(d).padStart(2, '0'), expense: 0, income: 0, balance: 0, count: 0 });
    for (const t of txs) {
      const ds = String(t.date);
      if (ds.slice(0, 7) !== ym) continue;
      const rec = days[Number(ds.slice(8, 10)) - 1];
      if (!rec) continue;
      if (t.type === 'expense') rec.expense += t.amount; else rec.income += t.amount;
      rec.count++;
    }
    for (const rec of days) rec.balance = rec.income - rec.expense;
    return days;
  }
  function categoryBreakdown(txs, ym, type) {
    const m = new Map();
    for (const t of txs) {
      if (t.type !== type) continue;
      if (ym && String(t.date).slice(0, 7) !== ym) continue;
      m.set(t.categoryId, (m.get(t.categoryId) || 0) + t.amount);
    }
    return [...m.entries()].map(([categoryId, amount]) => ({ categoryId, amount }))
      .sort((a, b) => b.amount - a.amount);
  }
  function monthTotals(txs, n) { // 直近nヶ月の配列(古→新) [{ym, expense, income}]
    const arr = [];
    const now = new Date();
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      const s = monthSummary(txs, ym);
      arr.push({ ym, ...s });
    }
    return arr;
  }
  return {
    round, stepDecimals, floorStep, ceilStep, stepCount,
    calcBuyQty, calcTargetPrice, calcSellQty, remainingQty,
    allocatePurchase, shortfallOf, fifoRemaining, fifoAllocateSale,
    monthSummary, dayTotals, categoryBreakdown, monthTotals
  };
})();

function fmtYen(n, withUnit = true) {
  const v = Math.round(Number(n) || 0);

  return withUnit ? s + '円' : s;
}
function fmtSignYen(n) {

  if (v > 0) return '+' + v.toLocaleString('ja-JP') + '円';
  return v.toLocaleString('ja-JP') + '円';
}
function fmtQty(q, decimals = 4) {

}
function fmtDateTime(s) { // 'YYYY-MM-DDTHH:mm' → 'YYYY/MM/DD HH:mm'
  if (!s) return '-';
  return s.replace('T', ' ').replace(/-/g, '/');
}
function todayStr() {

}

function nowLocalTs() {

}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function uid() {

async function copyText(txt) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(txt);
      return true;
    }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}
'use strict';
/* ================= IndexedDB ================= */
const DB_NAME = 'tsumiki-db';
const DB_VER = 2;
const STORES = ['settings', 'categories', 'fixedCosts', 'txs', 'reserves', 'currencies', 'priceCache', 'purchaseOrders', 'purchases', 'sales', 'sellOrders'];

let _db = null;
function idbOpen() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      for (const s of STORES) {
        if (!db.objectStoreNames.contains(s)) {
          const st = db.createObjectStore(s, { keyPath: 'id' });
          if (s === 'txs') st.createIndex('date', 'date');
          if (s === 'reserves') st.createIndex('txId', 'txId');
        }
      }
    };
    req.onsuccess = () => { _db = req.result; res(_db); };
    req.onerror = () => rej(req.error);
  });
}
function idbTx(store, mode = 'readonly') {
  return idbOpen().then(db => db.transaction(store, mode).objectStore(store));
}
function idbReq(r) {
  return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
const idbGet = async (store, id) => idbReq((await idbTx(store)).get(id));
const idbAll = async (store) => idbReq((await idbTx(store)).getAll()) || [];
const idbPut = async (store, obj) => idbReq((await idbTx(store, 'readwrite')).put(obj));
const idbDel = async (store, id) => idbReq((await idbTx(store, 'readwrite')).delete(id));
const idbClear = async (store) => idbReq((await idbTx(store, 'readwrite')).clear());
async function idbBulkPut(store, arr) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    const st = tx.objectStore(store);
    for (const o of arr) st.put(o);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

async function loadAll() {
  const [txs, cats, fix, resv, curs, pc, pos, pur, sal, set] = await Promise.all([
    idbAll('txs'), idbAll('categories'), idbAll('fixedCosts'), idbAll('reserves'),
    idbAll('currencies'), idbAll('priceCache'), idbAll('purchaseOrders'),
    idbAll('purchases'), idbAll('sales'), idbAll('settings')
  ]);
  S.txs = txs.sort((a, b) => (b.date + (b.createdAt || '')).localeCompare(a.date + (a.createdAt || '')));
  S.categories = cats.sort((a, b) => (a.order || 0) - (b.order || 0));
  S.fixedCosts = fix.sort((a, b) => (a.dayOfMonth || 0) - (b.dayOfMonth || 0));
  S.reserves = resv;
  S.sellOrders = await idbAll('sellOrders');
  S.currencies = curs;
  S.priceCache = Object.fromEntries(pc.map(p => [p.id, p]));
  S.purchaseOrders = pos.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  S.purchases = pur.sort((a, b) => ((a.datetime || '') + (a.createdAt || '')).localeCompare((b.datetime || '') + (b.createdAt || '')));
  S.sales = sal.sort((a, b) => ((b.datetime || '') + (b.createdAt || '')).localeCompare((a.datetime || '') + (a.createdAt || '')));
  S.settings = Object.fromEntries(set.map(s => [s.key, s]));
  PAY_METHODS = (S.settings.payMethods && Array.isArray(S.settings.payMethods.value) && S.settings.payMethods.value.length > 0) ? S.settings.payMethods.value : DEFAULT_PAY_METHODS;
}

/* --- 未購入金額(有効通貨) --- */
function pendingReserves() {
  const a = activeAsset();
  if (!a) return [];
  return S.reserves.filter(r => r.assetId === a.id && r.status === 'pending' && r.amount > 0)
    .sort((x, y) => (x.createdAt || '').localeCompare(y.createdAt || ''));
}
function pendingTotal() { return pendingReserves().reduce((s, r) => s + r.amount, 0); }

/* --- 保有・損益(有効通貨) --- */
function assetStats() {
  const a = activeAsset();
  const empty = { holdingsQty: 0, avgRate: 0, unsoldPrincipal: 0, totalBuyJPY: 0, totalSellJPY: 0, realized: 0, unrealized: 0, lots: [] };
  if (!a) return empty;
  const buys = S.purchases.filter(p => p.assetId === a.id);
  const sells = S.sales.filter(s2 => s2.assetId === a.id).sort((x, y) => (x.datetime || '').localeCompare(y.datetime || ''));
  if (buys.length === 0) return { ...empty, totalBuyJPY: 0, totalSellJPY: sells.reduce((s2, x) => s2 + (x.amountJPY || 0), 0) };
  const totalBuyJPY = buys.reduce((s2, p) => s2 + (p.amountJPY || 0), 0);
  const totalQty = roundQty(buys.reduce((s2, p) => s2 + Number(p.actualQty || 0), 0));
  const totalSellJPY = sells.reduce((s2, x) => s2 + (x.amountJPY || 0), 0);
  const totalSoldQty = roundQty(sells.reduce((s2, x) => s2 + Number(x.qty || 0), 0));
  // FIFO残
  const lots = [];
  let rest = totalSoldQty;
  for (const p of buys) {
    let remain = Number(p.actualQty || 0);
    if (rest > 0) { const use = Math.min(remain, rest); remain = roundQty(remain - use); rest = roundQty(rest - use); }
    if (remain > 1e-9) lots.push({ purchaseId: p.id, qty: remain, rate: Number(p.actualRate), datetime: p.datetime, amountJPY: Math.round(remain * Number(p.actualRate)) });
  }
  const holdingsQty = roundQty(lots.reduce((s2, l) => s2 + l.qty, 0));
  const unsoldPrincipal = lots.reduce((s2, l) => s2 + l.amountJPY, 0);
  const avgRate = holdingsQty > 0 ? unsoldPrincipal / holdingsQty : 0;
  const realized = sells.reduce((s2, x) => s2 + (x.realized || 0), 0);
  const price = Number((S.priceCache[a.id] || {}).last || 0);
  const unrealized = price > 0 ? Math.round(price * holdingsQty) - unsoldPrincipal : 0;
  return { holdingsQty, avgRate, unsoldPrincipal, totalBuyJPY, totalSellJPY, realized, unrealized, lots };
}
function roundQty(q) { return Math.round(Number(q) * 1e8) / 1e8; }

function openModal(html, dismissable = true) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="veil"${dismissable ? ' onclick="closeModal()"' : ''}></div><div class="box">${dismissable ? '<button class="mclose" onclick="closeModal()" aria-label="閉じる">✕</button>' : ''}<div class="grip"></div>${html}</div>`;
  root.classList.add('on');
  document.body.classList.add('modal-open');
  return root;
}
function closeModal() {
  const root = document.getElementById('modal-root');
  root.classList.remove('on'); root.innerHTML = '';
  document.body.classList.remove('modal-open');
}
function confirmModal(title, bodyHtml, okLabel, onOk, danger = false) {
  window._confirmCb = () => { closeModal(); onOk(); };
  openModal(`<h2>${esc(title)}</h2><div class="small" style="margin-bottom:14px">${bodyHtml}</div>
  <div class="row"><button class="btn sub" onclick="closeModal()">キャンセル</button>
  <button class="btn ${danger ? 'danger' : 'primary'}" onclick="_confirmCb()">${esc(okLabel)}</button></div>`);
}

async function pickMode(v) {
  await idbPut('settings', { id: 'assetMode', key: 'assetMode', value: v });
  await idbPut('settings', { id: 'welcomeDone', key: 'welcomeDone', value: true });
  await loadAll();

  buildTabbar();

const GEM_PROMPT = `あなたは、ユーザーのレシートを管理・集計する「家計簿アシスタント」です。
ユーザーからレシートの画像がアップロードされたら、以下のルールに厳密に従って処理してください。

1. 抽出項目
画像から以下の情報を正確に抽出してください。
日付(YYYY-MM-DD形式) / カテゴリ / 店舗名 / 金額(税込) / 支払方法 / 備考(具体的な商品名など)
画像から読み取れない情報は、推測で補完せず「不明」としてください。

2. カテゴリの分類ルール【厳守】
「カテゴリ」は、必ず以下のいずれか1つを使用してください。
食費 / 日用品 / 交通費 / 住居費 / 光熱水道 / 通信費 / 保険・医療 / 教育・教養 / 娯楽 / その他の支出

重要な制約
・上記以外のカテゴリ名を絶対に生成しないでください。表記は上記と完全一致させてください。
・独自の項目・費目・カテゴリを新しく作ってはいけません。
・「外食費」「飲料費」「雑費」「交際費」「ガソリン代」など、上記に存在しない名称をカテゴリとして出力してはいけません。
・どこにも明確に該当しない場合や判断に迷った場合は、必ず「その他の支出」にしてください。
・より具体的な分類名を付けたい場合でもカテゴリには使わず、「備考」に記載してください。

分類例
スーパーで購入した食品 → 食費
コンビニで購入した弁当 → 食費
洗剤・ティッシュ・ゴミ袋 → 日用品
電車・バス・タクシー → 交通費
映画・ゲーム・遊園地 → 娯楽
ガソリン → その他の支出(備考に「ガソリン」と記載)
本・雑誌 → その他の支出(備考に書名を記載)
分類できないもの → その他の支出
店舗の種類だけで判断せず、レシートに記載された商品・サービスの内容を優先して分類してください。

3. 出力前の検証【必須】
出力する前に「カテゴリ」の値を確認し、上記リストのいずれかと完全一致している場合のみ出力してください。
一致しない場合は出力前に適切なカテゴリへ修正し、判断できない場合は「その他の支出」に修正してください。

4. 出力形式
レシート1枚ごとに、次の2つを出力してください。
(1) 確認用の表: 列の順番は「日付 | カテゴリ | 店舗名 | 金額(税込) | 支払方法 | 備考」固定。
(2) 貼り付け用データ: 1行1件、タブ区切りで「日付 → カテゴリ → 店舗名 → 金額 → 支払方法 → 備考」の順にし、コードブロック内に「データ行のみ」を出力。見出しや説明文は含めない。
金額は半角数字(例: 1280 または 1,280)。日付は必ずYYYY-MM-DD形式。

最重要ルール
「カテゴリ」の自由生成は禁止です。必ず定義済みのリストから選び、存在しない項目名を新しく作ることは、いかなる場合も禁止です。`;

function copyPrompt() {
  const done = () => toast('プロンプトをコピーしました');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(GEM_PROMPT).then(done).catch(() => copyPromptFallback(done));
  } else copyPromptFallback(done);
}
function copyPromptFallback(done) {
  try {
    const ta = document.createElement('textarea');
    ta.value = GEM_PROMPT; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); done();
  } catch (e) { toast('コピーできませんでした。テキストを手動で選択してコピーしてください'); }
}

        <div class="a">自動同期はありません。<b>旧端末で「JSONでバックアップ」→ 新端末で「JSONから復元」</b>の順で移行してください。復元は上書き前に確認画面が出ます。</div></details>
      <details><summary>レシートの読み取りがうまくいきません</summary>
        <div class="a">明るい場所で、レシート全体がまっすぐ写るように撮ると精度が上がります。うまく読めないときは、他のAIにレシートを読ませて<b>「TSVを貼り付けて登録」</b>するのが確実です。</div></details>
      <details><summary>支出を登録したのに「未購入金額」が増えません</summary>
        <div class="a">設定 →「表示モード」が<b>「家計簿のみ」</b>になっていると積み立ては行いません。「家計 + つみたて」に切り替えると、その時点の支出分から表示されます。支出の修正・削除にも自動で追従します。</div></details>
      <details><summary>「家計簿のみ」と「家計 + つみたて」の違いは?</summary>
        <div class="a">「家計 + つみたて」は支出と同額を自動で積み立て、資産(XRP)の購入・売却画面も使えます。「家計簿のみ」は家計簿機能だけに絞った表示です。<b>切り替えてもデータは消えません</b>。</div></details>
      <details><summary>価格が「---」のまま、または更新されません</summary>
        <div class="a">価格は公開API(GMOコイン、取得できない場合はbitbank)から約1分ごとに取得します。通信環境を確認し、レートカードの<b>「更新」</b>を押してください。表示は参考値で、手数料は含みません。</div></details>
      <details><summary>アプリが自動で注文・売却してくれますか?</summary>
        <div class="a">いいえ。<b>数量や目標価格の計算を補助するだけ</b>で、発注は取引所のアプリで手動で行います。約定したら「購入履歴」「売却履歴」に登録すると、保有数量や損益に反映されます。</div></details>
      <details><summary>カテゴリを追加・並べ替えできますか?</summary>
        <div class="a">家計簿タブ →「カテゴリ」で追加・名前変更・削除ができます。行の右端「⋮⋮」をドラッグすると並び替えられ、<b>入力フォームのプルダウンにも反映</b>されます。</div></details>
      <details><summary>月の途中から使い始めました。過去の分は?</summary>
        <div class="a">記録タブで日付を過去にして登録すれば、その月の集計に入ります。登録済みの記録も「編集」から日付を変更できます。</div></details>
    </div>
  </div>`;
}

function openTsvModal() {
  openModal(`<h2>TSVデータを貼り付けて登録</h2>
  <div class="hint">1行 = 1件の支出。タブ区切りで<b>日付 → カテゴリ → 店舗名 → 金額 → 支払方法 → 備考</b>の順に貼り付けてください。</div>
  <textarea id="tsv-in" rows="7" spellcheck="false" style="margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:16px" placeholder="日付	カテゴリ	店舗名	金額	支払方法	備考&#10;2026-11-15	食料品	スーパー	1,280	デビットカード	食材"></textarea>
  <div id="tsv-preview"></div>
  <div class="row mt" id="tsv-actions"><button class="btn sub" onclick="closeModal()">キャンセル</button>
  <button class="btn primary" onclick="tsvReflect()">内容を確認</button></div>`);
  // クリップボードの内容を自動で貼り付け(権限が出ない場合は手動貼り付け)
  try {
    const area = document.getElementById('tsv-in');
    if (navigator.clipboard && navigator.clipboard.readText && area) {
      navigator.clipboard.readText().then(txt => {
        if (!txt || !txt.trim() || !area.value) {
          if (txt && txt.trim()) { area.value = txt.trim(); tsvReflect(); }
        }
      }).catch(() => {});
    }
  } catch (err) {}
}
function normDateStr(s) {
  const m = String(s).trim().match(/(\d{4})[./\-年]\s*(\d{1,2})[./\-月]\s*(\d{1,2})/);
  if (!m) return null;
  const d = `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
  return isNaN(new Date(d)) ? null : d;
}
function parseTsvLines(raw) {
  const other = S.categories.find(c => c.type === 'expense' && /その他/.test(c.name)) || S.categories.find(c => c.type === 'expense');
  return String(raw).split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const cols = (line.includes('\t') ? line.split('\t') : line.split(/\s{2,}/)).map(c => (c || '').trim());
    const [d, cat, shop, amt, pay, memo] = cols;
    const date = normDateStr(d);
    const amount = Math.round(Number(String(amt || '').replace(/[^\d.]/g, '')));
    if (!date || !amount || amount <= 0) return { error: true, raw: line };
    let c = cat ? S.categories.find(x => x.type === 'expense' && x.name === cat) : null;
    if (!c && cat) c = S.categories.find(x => x.type === 'expense' && (x.name.includes(cat) || cat.includes(x.name)));
    const fallback = !c;
    if (!c) c = other;
    let pm = PAY_METHODS.find(m => m === pay) || null;
    if (!pm && pay) {
      if (/デビット/.test(pay)) pm = 'デビットカード';
      else if (/クレジット/.test(pay)) pm = 'クレジットカード';
      else if (/電子|IC|交通|Suica|Pasmo|id\b/i.test(pay)) pm = '電子マネー';
      else if (/現金/.test(pay)) pm = '現金';
      else pm = 'その他';
    }
    return { date, categoryId: c.id, catLabel: c.name, fallback, shop: (shop || '').slice(0, 40), amount, pay: pm || '現金', memo: (memo || '').slice(0, 120) };
  });
}
function tsvReflect() {
  const preview = document.getElementById('tsv-preview');
  const rows = parseTsvLines(document.getElementById('tsv-in').value);
  const ok = rows.filter(r => !r.error), bad = rows.filter(r => r.error);
  if (ok.length === 0) {
    preview.innerHTML = '<div class="errbox">読み取れる行がありませんでした。日付・金額がタブ区切りで入っているか確認してください。</div>';
    return;
  }
  if (ok.length === 1) {
    const r = ok[0];
    closeModal();
    go('ledger'); S.ledgerTab = 'entry'; renderLedger();
    setTxType('expense');
    document.getElementById('tx-date').value = r.date;
    document.getElementById('tx-amount').value = r.amount;
    document.getElementById('tx-category').value = r.categoryId;
    document.getElementById('tx-pay').value = r.pay;
    document.getElementById('tx-shop').value = r.shop;
    document.getElementById('tx-memo').value = r.memo;
    const area = document.getElementById('ocr-area');
    if (area) area.innerHTML = `<div class="okbox">TSVの内容をフォームに反映しました。確認して「登録する」を押してください。${r.fallback ? '<br>カテゴリ「' + esc(r.catLabel) + '」に分類しました(入力カテゴリは既存と未一致でした)。' : ''}</div>`;
    toast('フォームに反映しました');
    return;
  }
  window._tsvRows = ok;
  preview.innerHTML = `
  <div class="okbox mt">${ok.length}件の支出を読み取りました。内容を確認して登録してください。</div>
  <div style="margin-top:6px">${ok.map(r => `
    <div class="tsvrow${r.fallback ? ' fx' : ''}">
      <div style="flex:1;min-width:0"><div class="t">${esc(r.date)} ・ ${esc(r.shop || '(店舗名なし)')}</div>
      <div class="d">${esc(r.catLabel)}${r.fallback ? '(未一致 → その他に分類)' : ''} ・ ${esc(r.pay)}${r.memo ? ' ・ ' + esc(r.memo) : ''}</div></div>
      <div class="amt">${fmtYen(r.amount)}</div>
    </div>`).join('')}
  ${bad.length ? bad.map(b => `<div class="tsvrow fx"><div style="flex:1"><div class="d">読み飛ばし(日付か金額が不正): ${esc(b.raw)}</div></div></div>`).join('') : ''}</div>
  <button class="btn primary block mt" onclick="tsvSaveAll()">${ok.length}件を一括登録する</button>`;
}
async function tsvSaveAll() {
  const rows = window._tsvRows || [];
  if (!rows.length) return;
  const a = activeAsset();
  for (const r of rows) {
    const tx = {
      id: uid(), type: 'expense', date: r.date, amount: r.amount, categoryId: r.categoryId,
      paymentMethod: r.pay, shop: r.shop, memo: r.memo, createdAt: nowLocalTs(), updatedAt: nowLocalTs()
    };
    await idbPut('txs', tx);
    if (a) await idbPut('reserves', { id: uid(), txId: tx.id, assetId: a.id, amount: tx.amount, status: 'pending', createdAt: nowLocalTs() });
  }
  window._tsvRows = null;
  await loadAll();
  toast(`${rows.length}件の支出を登録しました${assetModeOn() ? '(未購入金額に加算)' : ''}`);
  closeModal(); renderTab(currentTab); updateMiniPrice();
}

    </div>
  </div>
  <div id="an-slot"></div>
  <div class="card">
    <h2>カテゴリ別支出 <span class="tag">${esc(sumYm)}</span></h2>

    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="月別収支グラフ">
      ${bars}
      <rect x="0" y="0" width="0" height="0"/>
    </svg>
    <div class="legend"><span><span class="sw" style="background:var(--spend)"></span>支出</span>
    <span><span class="sw" style="background:var(--income)"></span>収入</span></div>
  </div>
  ${ledgerDayCardHtml(days, sumYm)}`;
}
/* --- 日ごとの収支カード --- */
function ledgerDayCardHtml(days, ym) {
  const active = days.filter(d => d.count > 0).slice().reverse();
  const maxD = Math.max(1, ...days.map(d => Math.max(d.expense, d.income)));
  const DW = 560, DH = 190, dpad = 30, plotH = DH - 54;
  const stepX = (DW - dpad - 6) / days.length;
  const bw = Math.max(3, Math.min(8, stepX / 2 - 1.2));
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  let bars = '';
  days.forEach((d, i) => {
    const x = dpad + i * stepX + Math.max(0, (stepX - bw * 2 - 1) / 2);
    const he = Math.round(d.expense / maxD * plotH);
    const hi = Math.round(d.income / maxD * plotH);
    if (he > 0) bars += `<rect x="${x.toFixed(1)}" y="${DH - 30 - he}" width="${bw.toFixed(1)}" height="${he}" rx="1.5" fill="var(--spend)"/>`;
    if (hi > 0) bars += `<rect x="${(x + bw + 1).toFixed(1)}" y="${DH - 30 - hi}" width="${bw.toFixed(1)}" height="${hi}" rx="1.5" fill="var(--income)"/>`;
    if (d.day === 1 || d.day % 5 === 0 || d.day === days.length)
      bars += `<text x="${(x + bw).toFixed(1)}" y="${DH - 11}" text-anchor="middle" font-size="10" fill="var(--sub)">${d.day}</text>`;
  });
  return `
  <div class="card">
    <h2>日ごとの収支 <span class="tag">${esc(ym.replace('-', '/'))}</span></h2>
    <svg class="chart" viewBox="0 0 ${DW} ${DH}" role="img" aria-label="日別収支グラフ">${bars}</svg>
    <div class="legend"><span><span class="sw" style="background:var(--spend)"></span>支出</span>
    <span><span class="sw" style="background:var(--income)"></span>収入</span></div>
    ${active.length === 0 ? '<div class="hint">この月の記録はまだありません。記録タブから支出・収入を登録できます。</div>' : active.map(d => {
      const wd = WD[new Date(d.date + 'T00:00:00').getDay()];
      return `<div class="lrow tap" onclick="openDayDetail('${d.date}')">
        <div class="ico ${d.income > 0 && d.balance >= 0 ? 'inc' : 'exp'}">${d.day}</div>
        <div class="mid"><div class="t">${Number(ym.slice(5))}月${d.day}日(${wd})</div>
        <div class="d">支出 ${fmtYen(d.expense)} ・ 収入 ${fmtYen(d.income)} ・ ${d.count}件</div></div>
        <div class="amt" style="color:var(--${d.balance >= 0 ? 'ok' : 'danger'})">${fmtSignYen(d.balance)}</div>
      </div>`;
    }).join('')}
    ${days.some(d => d.count > 0) ? '<div class="hint" style="margin-top:10px">日付をタップすると、その日の内訳(何にいくら使ったか)を確認できます。</div>' : ''}
  </div>`;
}
function anFill() {
  const slot = document.getElementById('an-slot');
  if (!slot) return;
  try { slot.innerHTML = ledgerAnalysisCardHtml(sumYm); }
  catch (e) {
    console.error('analysis card error', e);
    slot.innerHTML = `<div class="card"><h2>支出の分析</h2>
      <div class="hint">分析カードの表示でエラーが発生しました(${esc(String(e && e.message || e))})。記録タブで支出を1件登録すると再計算されます。</div></div>`;
  }
}
/* --- 支出分析カード --- */
function anYmShift(ym, n) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function anExp(ym) { return S.txs.filter(t => t.type === 'expense' && t.date.slice(0, 7) === ym); }
function anInc(ym) { return S.txs.filter(t => t.type === 'income' && t.date.slice(0, 7) === ym).reduce((a, t) => a + t.amount, 0); }
function anTotal(ym) { return anExp(ym).reduce((a, t) => a + t.amount, 0); }
function anPct(d, p) { return p > 0 ? Math.round(d / p * 100) : null; }

function ledgerAnalysisCardHtml(ym) {
  const prev = anYmShift(ym, -1);
  const cur = anExp(ym), prv = anExp(prev);
  const total = cur.reduce((a, t) => a + t.amount, 0);
  const ptot = prv.reduce((a, t) => a + t.amount, 0);
  if (!total && !ptot) return `<div class="card"><h2>支出の分析 <span class="tag">${esc(ym.replace('-', '/'))}</span></h2>
    <div class="hint">支出の記録が増えると、カテゴリ別の増減や貯蓄率などの分析がここに表示されます。</div></div>`;
  const map = {}, pmap = {};
  cur.forEach(t => { (map[t.categoryId] = map[t.categoryId] || { c: 0, n: 0 }); map[t.categoryId].c += t.amount; map[t.categoryId].n++; });
  prv.forEach(t => { pmap[t.categoryId] = (pmap[t.categoryId] || 0) + t.amount; });
  const rowsC = Object.keys(map).map(id => ({ id, c: map[id].c, n: map[id].n, p: pmap[id] || 0, d: map[id].c - (pmap[id] || 0) }))
    .sort((a, b) => b.c - a.c);
  const maxC = Math.max(1, ...rowsC.map(r => Math.max(r.c, r.p)));
  const days = new Set(cur.map(t => t.date)).size;
  const perDay = days ? Math.round(total / days) : 0;
  const diff = total - ptot;
  const pct = anPct(diff, ptot);

  // 6ヶ月の支出推移(カテゴリ別の積み上げ)
  const PAL = ['#d9695a', '#e2a03f', '#5b9f7d', '#4c8bbf', '#8a7bc8', '#c2699a', '#7c8a95', '#a9b04f'];
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const y2 = anYmShift(ym, -i), byC = {};
    S.txs.filter(t => t.type === 'expense' && t.date.slice(0, 7) === y2)
      .forEach(t => { byC[t.categoryId] = (byC[t.categoryId] || 0) + t.amount; });
    months.push({ ym: y2, v: Object.keys(byC).reduce((a, k) => a + byC[k], 0), byC });
  }
  const catTotals = {};
  months.forEach(m => Object.keys(m.byC).forEach(k => { catTotals[k] = (catTotals[k] || 0) + m.byC[k]; }));
  const cats = Object.keys(catTotals).sort((a, b) => catTotals[b] - catTotals[a]).slice(0, 8);
  rowsC.forEach(r => { if (cats.indexOf(r.id) < 0) cats.push(r.id); });
  const colorOf = id => PAL[Math.max(0, cats.indexOf(id)) % PAL.length];
  const mMax = Math.max(1, ...months.map(m => m.v));
  const SW = 560, SH = 300, pad = 34, ph = SH - 62;
  const stp = (SW - pad - 8) / months.length;
  let svg = '';
  [0.5, 1].forEach(g => {
    const y = (SH - 34 - g * ph).toFixed(1);
    svg += `<line x1="${pad}" y1="${y}" x2="${SW - 8}" y2="${y}" stroke="var(--surface2)" stroke-width="1"/>`;
  });
  months.forEach((m, i) => {
    const bw2 = Math.min(46, stp * 0.6);
    const x = pad + i * stp + (stp - bw2) / 2;
    let acc = 0;
    cats.forEach(id => {
      const v2 = m.byC[id] || 0;
      if (!v2) return;
      const h = v2 / mMax * ph;
      const y = SH - 34 - (acc + h);
      svg += `<rect class="seg" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw2.toFixed(1)}" height="${Math.max(1.5, h).toFixed(1)}" fill="${colorOf(id)}" onclick="openCatDetail('${esc(id)}','${m.ym}')"><title>${esc(catName(id))} ${fmtYen(v2)} ・タップで詳細</title></rect>`;
      acc += h;
    });
    if (m.v) svg += `<text x="${(x + bw2 / 2).toFixed(1)}" y="${(SH - 41 - acc).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--sub)">${Math.round(m.v / 1000)}k</text>`;
    svg += `<text x="${(x + bw2 / 2).toFixed(1)}" y="${SH - 15}" text-anchor="middle" font-size="11" fill="var(--sub)">${Number(m.ym.slice(5))}月</text>`;
  });
  const legend = cats.map(id => `<span class="lgd" onclick="openCatDetail('${esc(id)}','${ym}')"><span class="sw" style="background:${colorOf(id)}"></span>${esc(catName(id))}</span>`).join('');

  // 見えてきたこと
  const tips = [];
  const fixedSum = cur.filter(t => t.fixedCostId).reduce((a, t) => a + t.amount, 0);
  const lowArr = cur.filter(t => t.amount < 1000);
  const lowSum = lowArr.reduce((a, t) => a + t.amount, 0);
  const inc = anInc(ym);
  const up = rowsC.filter(r => r.p > 0 && r.d > 0).sort((a, b) => b.d - a.d)[0];
  const down = rowsC.filter(r => r.d < 0).sort((a, b) => a.d - b.d)[0];
  const neu = rowsC.filter(r => r.p === 0 && r.c > 0).sort((a, b) => b.c - a.c)[0];
  if (up) tips.push({ t: `${catName(up.id)} が前月より ${fmtYen(up.d)} 増`, d: `前月 ${fmtYen(up.p)} → 今月 ${fmtYen(up.c)}(+${anPct(up.d, up.p)}%)。${up.n}件・1回あたり平均 ${fmtYen(Math.round(up.c / up.n))} なので、回数を月2回減らすだけで約 ${fmtYen(Math.round(up.c / up.n) * 2)} 戻せます。` });
  if (down) tips.push({ t: `${catName(down.id)} は ${fmtYen(-down.d)} 減`, d: `前月 ${fmtYen(down.p)} → 今月 ${fmtYen(down.c)}(${anPct(down.d, down.p)}%)。この調子を維持できるか、来月も同じカテゴリを見てみましょう。` });
  if (inc > 0) {
    const rate = Math.round((inc - total) / inc * 100);
    tips.push({ t: `貯蓄率 ${rate}%`, d: `収入 ${fmtYen(inc)} に対して支出 ${fmtYen(total)}。${rate >= 20 ? '20%以上を確保できています。この割合を崩さないことが一番効きます。' : rate >= 0 ? '10〜20%台です。固定費を1つ見直すと5%ほど上げられます。' : '赤字の月です。まずは変動費の大きいカテゴリを1つだけ削るのが現実的です。'}` });
  }
  if (fixedSum > 0) {
    const fr = Math.round(fixedSum / total * 100);
    tips.push({ t: `固定費は支出の ${fr}%`, d: `固定費 ${fmtYen(fixedSum)}。${fr >= 45 ? '半分近くが固定費なので、削るならここが最短です(サブスク・保険・通信)。' : fr <= 30 ? '30%以下に収まっています。変動費の管理に集中してよさそうです。' : '目安は30%前後。契約の更新月を確認しておくと安全です。'}` });
  }
  if (lowArr.length >= 3 && total > 0 && lowSum / total >= 0.12) {
    tips.push({ t: `¥1,000未満の支出が ${lowArr.length}件`, d: `合計 ${fmtYen(lowSum)}(支出の ${Math.round(lowSum / total * 100)}%)。コンビニ・自販機・少額決済の積み上げです。週に2回だけでも「買わない日」を作ると効きます。` });
  }
  if (neu) tips.push({ t: `新しいカテゴリ「${catName(neu.id)}」が登場`, d: `今月 ${fmtYen(neu.c)}・${neu.n}件。一時的な出費か、これから続く支出かを来月の数字で見極めましょう。` });

  return `
  <div class="card" id="an-card">
    <h2>支出の分析 <span class="tag">${esc(ym.replace('-', '/'))}</span></h2>
    <div class="statgrid">
      <div class="stat"><div class="l">支出合計</div><div class="v spend">${fmtYen(total)}</div></div>
      <div class="stat"><div class="l">前月比</div><div class="v ${diff >= 0 ? 'minus' : 'plus'}">${diff >= 0 ? '+' : '-'}${fmtYen(Math.abs(diff))}<small>${pct === null ? '前月なし' : (pct >= 0 ? '+' : '') + pct + '%'}</small></div></div>
      <div class="stat"><div class="l">1日あたり</div><div class="v">${fmtYen(perDay)}</div></div>
      <div class="stat"><div class="l">記録日数</div><div class="v">${days}<small>日</small></div></div>
    </div>
    <b class="seclab">直近6ヶ月の支出</b>
    <svg class="chart" viewBox="0 0 ${SW} ${SH}" role="img" aria-label="直近6ヶ月の支出(カテゴリ別積み上げ)">${svg}</svg>
    <div class="legend lgdwrap">${legend}</div>
    <b class="seclab">カテゴリ別 前月比 <small>タップで詳細</small></b>
    ${rowsC.length === 0 ? '<div class="hint">今月の支出はまだありません。</div>' : rowsC.map(r => {
      const p2 = anPct(r.d, r.p);
      return `<div class="cmp" onclick="openCatDetail('${esc(r.id)}','${ym}')">
        <div class="cmL"><div class="cmN">${esc(catName(r.id))} <span class="cmC">${r.n}件</span></div>
          <div class="cmpbar"><i style="width:${(r.c / maxC * 100).toFixed(1)}%;background:${colorOf(r.id)}"></i></div>
          ${r.p > 0 ? `<div class="cmpbar"><i style="width:${(r.p / maxC * 100).toFixed(1)}%;background:${colorOf(r.id)};opacity:.35"></i></div>` : ''}
        </div>
        <div class="cmR"><div class="cmA">${fmtYen(r.c)}</div><div class="cmP">前月 ${r.p ? fmtYen(r.p) : '記録なし'}</div></div>
        <div class="dlt" style="color:var(--${r.d > 0 ? 'spend' : r.d < 0 ? 'ok' : 'sub'})">${r.p === 0 ? '新規' : (r.d > 0 ? '+' : '') + fmtYen(r.d)}<div class="dltp">${p2 === null ? '' : (p2 >= 0 ? '+' : '') + p2 + '%'}</div></div>
      </div>`;
    }).join('')}
    <b class="seclab">見えてきたこと</b>
    ${tips.slice(0, 4).map(t => `<div class="tip"><div class="t">${t.t}</div><div class="d">${t.d}</div></div>`).join('')}
    <div class="hint" style="margin-top:10px">棒の色(積み上げのセグメント)や凡例のカテゴリ名をタップすると、そのカテゴリの詳細(6ヶ月の推移・お店別)が開きます。</div>
  </div>`;
}

function openCatDetail(catId, ym) {
  const cur = anExp(ym).filter(t => t.categoryId === catId);
  if (!cur.length) { toast('このカテゴリの支出はありません'); return; }
  const total = cur.reduce((a, t) => a + t.amount, 0);
  const prev = anYmShift(ym, -1);
  const ptot = anExp(prev).filter(t => t.categoryId === catId).reduce((a, t) => a + t.amount, 0);
  const months = [];
  for (let i = 5; i >= 0; i--) { const y2 = anYmShift(ym, -i); months.push({ ym: y2, v: anExp(y2).filter(t => t.categoryId === catId).reduce((a, t) => a + t.amount, 0) }); }
  const mMax = Math.max(1, ...months.map(m => m.v));
  const SW = 560, SH = 140, pad = 18, ph = SH - 40, stp = (SW - pad - 6) / 6;
  let svg = '';
  months.forEach((m, i) => {
    const h = Math.round(m.v / mMax * ph), bw2 = Math.min(34, stp * 0.55);
    const x = pad + i * stp + (stp - bw2) / 2;
    if (h > 0) svg += `<rect x="${x.toFixed(1)}" y="${SH - 26 - h}" width="${bw2.toFixed(1)}" height="${h}" rx="3" fill="${m.ym === ym ? 'var(--spend)' : 'var(--surface2)'}"/>`;
    if (m.v) svg += `<text x="${(x + bw2 / 2).toFixed(1)}" y="${(SH - 30 - h).toFixed(1)}" text-anchor="middle" font-size="9" fill="var(--sub)">${Math.round(m.v / 1000)}k</text>`;
    svg += `<text x="${(x + bw2 / 2).toFixed(1)}" y="${SH - 10}" text-anchor="middle" font-size="10" fill="var(--sub)">${Number(m.ym.slice(5))}月</text>`;
  });
  const shops = {};
  cur.forEach(t => { const k = t.shop || '(店舗名なし)'; shops[k] = (shops[k] || 0) + t.amount; });
  const shopArr = Object.keys(shops).map(k => ({ k, v: shops[k] })).sort((a, b) => b.v - a.v).slice(0, 5);
  const sMax = Math.max(1, ...shopArr.map(x => x.v));
  const pays = {};
  cur.forEach(t => { const k = t.paymentMethod || '未記録'; pays[k] = (pays[k] || 0) + t.amount; });
  const diff = total - ptot;
  const p2 = anPct(diff, ptot);
  openModal(`<h2>${esc(catName(catId))} <span class="tag">${esc(ym.replace('-', '/'))}</span></h2>
    <div class="statgrid">
      <div class="stat"><div class="l">今月</div><div class="v spend">${fmtYen(total)}</div></div>
      <div class="stat"><div class="l">前月比</div><div class="v ${diff >= 0 ? 'minus' : 'plus'}">${ptot === 0 ? '新規' : (diff >= 0 ? '+' : '') + fmtYen(diff)}</div></div>
      <div class="stat"><div class="l">件数</div><div class="v">${cur.length}<small>件</small></div></div>
      <div class="stat"><div class="l">1回あたり</div><div class="v">${fmtYen(Math.round(total / cur.length))}</div></div>
    </div>
    <b class="seclab">6ヶ月の推移${p2 === null ? '' : ' / 前月比 ' + (p2 >= 0 ? '+' : '') + p2 + '%'}</b>
    <svg class="chart" viewBox="0 0 ${SW} ${SH}" role="img" aria-label="${esc(catName(catId))}の6ヶ月推移">${svg}</svg>
    <b class="seclab">お店別(上位5)</b>
    ${shopArr.map(x => `<div class="barslot"><span class="nm">${esc(x.k)}</span>
      <div class="barwrap"><div class="bar" style="width:${(x.v / sMax * 100).toFixed(1)}%;background:var(--spend)"></div></div>
      <span class="amt">${fmtYen(x.v)}</span></div>`).join('')}
    <b class="seclab">支払い方法</b>
    ${Object.keys(pays).sort((a, b) => pays[b] - pays[a]).map(k => `<div class="prow"><span>${esc(k)}</span><b>${fmtYen(pays[k])}</b></div>`).join('')}
    <div class="hint mt">「${esc(catName(catId))}」の明細は、記録タブでこのカテゴリを選ぶと確認できます。</div>`);
}

/* --- 日別の内訳モーダル --- */
function openDayDetail(date) {
  const list = S.txs.filter(t => t.date === date)
    .sort((a, b) => (a.type === b.type ? b.amount - a.amount : a.type === 'expense' ? -1 : 1));
  if (!list.length) { toast('この日の記録はありません'); return; }
  const exp = list.filter(t => t.type === 'expense').reduce((s2, t) => s2 + t.amount, 0);
  const inc = list.filter(t => t.type === 'income').reduce((s2, t) => s2 + t.amount, 0);
  const m = Number(date.slice(5, 7)), d = Number(date.slice(8, 10));
  const wd = ['日', '月', '火', '水', '木', '金', '土'][new Date(date + 'T00:00:00').getDay()];
  const rows = list.map(t => {
    const isExp = t.type === 'expense';
    const sub = [t.paymentMethod, t.memo].filter(Boolean).join(' ・ ');
    return `<div class="lrow">
      <div class="ico ${isExp ? 'exp' : 'inc'}">${isExp ? '支' : '収'}</div>
      <div class="mid"><div class="t">${esc(catName(t.categoryId))}${t.shop ? '・' + esc(t.shop) : ''}${t.fixedCostId ? ' <span class="pill fb">固定費</span>' : ''}</div>
      <div class="d">${esc(sub || (isExp ? '支払方法の記録なし' : '収入'))}</div></div>
      <div class="amt" style="color:var(--${isExp ? 'spend' : 'income'})">${isExp ? '' : '+'}${fmtYen(t.amount)}</div>
    </div>`;
  }).join('');
  openModal(`<h2>${m}月${d}日(${wd})の収支 <span class="tag">${list.length}件</span></h2>
    <div class="statgrid">
      <div class="stat"><div class="l">支出合計</div><div class="v spend">${fmtYen(exp)}</div></div>
      <div class="stat"><div class="l">収入合計</div><div class="v income">${fmtYen(inc)}</div></div>
      <div class="stat"><div class="l">収支</div><div class="v ${inc - exp >= 0 ? 'plus' : 'minus'}">${fmtSignYen(inc - exp)}</div></div>
    </div>
    <div class="mt">${rows}</div>
    <div class="hint mt">修正するときは家計簿タブ「記録」から編集できます。</div>`);
}
function navMonth(d) {
  const [y, m] = sumYm.split('-').map(Number);
  const dt = new Date(y, m - 1 + d, 1);
  sumYm = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
  renderLedger();
}

/* --- 固定費タブ --- */
function fixedCostHtml() {
  const rows = S.fixedCosts.map(f => `<div class="lrow">
    <div class="ico exp">固</div>
    <div class="mid"><div class="t">${esc(f.name)}</div><div class="d">毎月${f.dayOfMonth || '?'}日 ${f.active === false ? '・停止中' : ''}</div></div>
    <div class="amt">${fmtYen(f.amount)}</div>
    <div class="ops"><button class="btn sm sub" onclick="editFixed('${f.id}')">編集</button></div>
  </div>`).join('');
  const sum = S.fixedCosts.filter(f => f.active !== false).reduce((s, f) => s + f.amount, 0);
  return `
  <div class="card">
    <h2>固定費 <span class="tag">月${fmtYen(sum)}</span></h2>
    ${rows || '<div class="hint">固定費が未登録です。家賃・通信費などを登録すると毎月の支出入力が楽になります。</div>'}
    <button class="btn sub block mt" onclick="editFixed(null)">＋ 固定費を追加</button>
  </div>

/* --- ドラッグ&ドロップでの並び替え(ドラッグ中はDOMを書き換えない方式) --- */
let dragCtx = null;
function catDragStart(e) {
  const row = e.currentTarget.closest('.lrow');
  if (!row || !(row.dataset.catid || row.dataset.payid)) return;
  const rows = [...row.parentElement.children].filter(r => r.dataset && (r.dataset.catid || r.dataset.payid));
  if (rows.length < 2) return;
  e.preventDefault();
  const i0 = rows.indexOf(row);
  const rects = rows.map(r => r.getBoundingClientRect());
  dragCtx = {
    row, rows, list: row.parentElement, originIdx: i0, idx: i0,
    slots: rects.map(rc => rc.top),
    heights: rects.map(rc => rc.height),
    grab: e.clientY - rects[i0].top
  };
  row.classList.add('dragging');
  rows.forEach(r => r.classList.remove('drop-above', 'drop-below'));
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
}
function catDragMove(e) {
  if (!dragCtx) return;
  e.preventDefault();
  const c = dragCtx, n = c.rows.length;
  const rowH = c.heights[c.originIdx];
  // 指の位置にそのまま追従(一覧の範囲内に制限)。スロット位置は開始時に固定済み。
  let target = e.clientY - c.grab;
  const topBound = c.slots[0];
  const botBound = c.slots[n - 1] + c.heights[n - 1] - rowH;
  target = Math.max(topBound, Math.min(botBound, target));
  c.row.style.transform = `translateY(${target - c.slots[c.originIdx]}px)`;
  // 挿入位置=自分以外のスロットの中点を越えた数
  const cy = target + rowH / 2;
  const others = c.rows.filter(r => r !== c.row);
  let idx = 0;
  for (let i = 0; i < n; i++) {
    if (c.rows[i] === c.row) continue;
    if (cy > c.slots[i] + c.heights[i] / 2) idx++;
  }
  c.idx = idx;
  // 挿入位置の目印(緑の線)
  c.rows.forEach(r => r.classList.remove('drop-above', 'drop-below'));
  if (idx < others.length) others[idx].classList.add('drop-above');
  else others[others.length - 1].classList.add('drop-below');
}
async function catDragEnd() {
  if (!dragCtx) return;
  const c = dragCtx; dragCtx = null;
  c.row.classList.remove('dragging');
  c.row.style.transform = '';
  c.rows.forEach(r => r.classList.remove('drop-above', 'drop-below'));
  const others = c.rows.filter(r => r !== c.row);
  const finalRows = [...others.slice(0, c.idx), c.row, ...others.slice(c.idx)];
  if (c.row.dataset.payid) { // 支払方法の並び順を保存
    const arr = finalRows.map(r => r.dataset.payid);
    if (arr.join('|') !== PAY_METHODS.join('|')) {
      PAY_METHODS = arr.slice();
      await savePayMethods(); await loadAll(); renderLedger();
    }
    return;
  }
  let changed = false;
  for (let k = 0; k < finalRows.length; k++) {
    const cat = S.categories.find(x => x.id === finalRows[k].dataset.catid);
    if (cat && cat.order !== k) { cat.order = k; await idbPut('categories', cat); changed = true; }
  }
  if (changed) { await loadAll(); renderLedger(); }
}

/* --- 買い約定→購入登録→売り注文モーダル --- */
async function fillBuyOrder(orderId) {
  const a = activeAsset();
  const o = S.purchaseOrders.find(x => x.id === orderId);
  if (!o) return;
  const amountJPY = Math.round(Number(o.rate) * Number(o.qty));
  let alloc;
  if ((o.reserveIds || []).length) {
    alloc = o.reserveIds.map(id => { const r = S.reserves.find(x => x.id === id); return r ? { reserveId: id, txId: r.txId, amount: r.amount } : null; }).filter(Boolean);
  } else {
    alloc = Core.allocatePurchase(pendingReserves(), amountJPY).links;
  }
  const pur = {
    id: uid(), assetId: a.id, datetime: nowLocalTs(), actualRate: Number(o.rate), actualQty: Number(o.qty), amountJPY,
    orderRate: Number(o.rate), orderQty: Number(o.qty), fee: null, memo: '買い注文の約定', reserveAlloc: alloc, createdAt: nowLocalTs()
  };
  await idbPut('purchases', pur);
  for (const l of alloc) {
    const r = S.reserves.find(x => x.id === l.reserveId);
    if (!r) continue;
    if (l.amount >= r.amount) { r.status = 'linked'; r.purchaseId = pur.id; await idbPut('reserves', r); }
    else {
      await idbPut('reserves', { id: r.id, txId: r.txId, assetId: r.assetId, amount: l.amount, status: 'linked', purchaseId: pur.id, createdAt: r.createdAt });
      await idbPut('reserves', { id: uid(), txId: r.txId, assetId: r.assetId, amount: r.amount - l.amount, status: 'pending', createdAt: nowLocalTs() });
    }
  }
  o.status = 'filled';
  await idbPut('purchaseOrders', o);
  await loadAll();
  toast(`買い約定を記録しました(${fmtQty(pur.actualQty, a.qtyDecimals)} ${esc(a.code)})`);
  openSellOrderModal(pur.id);
}

'use strict';
/* ================= 価格取得(GMOコイン公開API + 代替) ================= */
const PRICE_API = {
  gmo: {
    name: 'GMOコイン公開API',
    ticker: pair => `https://api.coin.z.com/public/v1/ticker?symbol=${pair}`,
    parse: j => {
      const d = j.data[0];
      return { last: Number(d.last), ask: Number(d.ask), bid: Number(d.bid), high: Number(d.high), low: Number(d.low), officialLow: true, ts: d.timestamp };
    }
  },
  bitbank: {
    name: 'bitbank公開API(代替)',
    ticker: pair => {
      const [c, q] = pair.split('_');
      return `https://public.bitbank.cc/${c.toLowerCase()}_${q.toLowerCase()}/ticker`;
    },
    parse: j => {
      if (j.success !== 1) throw new Error('bitbank error');
      const d = j.data;
      return { last: Number(d.last), ask: Number(d.sell), bid: Number(d.buy), high: Number(d.high), low: Number(d.low), officialLow: true, ts: d.timestamp ? new Date(d.timestamp).toISOString() : new Date().toISOString() };
    }
  }
};
function jstDateStr(d = new Date()) {
  const j = new Date(d.getTime() + 9 * 3600 * 1000);
  return j.toISOString().slice(0, 10);
}
function fetchWithTimeout(url, ms = 9000) {
  return Promise.race([
    fetch(url, { cache: 'no-store' }),
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
  ]);
}
async function fetchPriceOnce() {
  if (!assetModeOn()) return;
  const a = activeAsset();
  if (!a) return;
  const sources = ['gmo', 'bitbank'];
  let ok = false;
  for (const src of sources) {
    const api = PRICE_API[src];
    try {
      const r = await fetchWithTimeout(api.ticker(a.pair));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const parsed = api.parse(await r.json());
      applyPrice(a, parsed, src);
      ok = true;
      break;
    } catch (e) {
      S.apiErrMsg = `${api.name}: ${e.message || e}`;
    }
  }
  if (!ok) {
    S.apiState = 'error';
    // 最安値の観測値フォールバックは保持済み
  }
  await savePriceCache();
  if (currentTab === 'asset' || currentTab === 'home') renderTab(currentTab);
}
function applyPrice(a, p, source) {
  const today = jstDateStr();
  const prev = S.priceCache[a.id] || {};
  const rec = {
    id: a.id, last: p.last, ask: p.ask, bid: p.bid, high: p.high,
    lowSource: p.officialLow ? 'official' : (prev.lowSource || 'observed'),
    lowDate: today, ts: nowLocalTs(), apiTs: p.ts || ''
  };
  // 日付が変わったら新しい日の最安値管理へ
  if (prev.lowDate !== today) {
    rec.low = p.officialLow ? p.low : p.last;
    rec.high = p.officialLow ? p.high : p.last;
  } else {
    rec.low = p.officialLow ? p.low : Math.min(prev.low || Infinity, p.last);
    rec.high = p.officialLow ? Math.max(prev.high || 0, p.high || p.last) : Math.max(prev.high || 0, p.last);
  }
  if (!p.officialLow && prev.lowSource === 'official' && prev.lowDate === today) {
    rec.lowSource = 'official'; rec.low = prev.low; // 公式値を優先して保持
  }
  S.priceCache[a.id] = rec;
  S.apiState = source === 'gmo' ? 'ok' : 'fallback';
  S.apiSource = source;
  S.apiErrMsg = '';
}
async function savePriceCache() {
  const a = activeAsset();
  if (a && S.priceCache[a.id]) await idbPut('priceCache', S.priceCache[a.id]);
}
let priceTimer = null;
function startPriceLoop() {
  if (!priceTimer) {
    priceTimer = setInterval(() => { if (!document.hidden && assetModeOn()) fetchPriceOnce(); }, 60000);

}

async function exportBackup() {
  const data = { app: 'tsumiki', schemaVersion: 1, exportedAt: new Date().toISOString(), data: {} };
  for (const s of STORES) data.data[s] = await idbAll(s);
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const aEl = document.createElement('a');
  aEl.href = url;
  aEl.download = 'tsumiki-backup-' + todayStr().replace(/-/g, '') + '.json';
  document.body.appendChild(aEl); aEl.click(); aEl.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('バックアップをダウンロードしました');
}
function importBackup(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let json;
    try { json = JSON.parse(reader.result); } catch (e) { toast('JSONを読み込めませんでした'); return; }
    if (!json || json.app !== 'tsumiki' || !json.data) { toast('このアプリのバックアップではありません'); return; }
    const counts = Object.entries(json.data).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.length : 0}件`).join(' / ');
    confirmModal('データを復元しますか?',
      `復元すると<b>現在の全データが上書き</b>されます。この操作は取り消せません。<br><br>バックアップ内容:<br><span class="mut">${esc(counts)}</span><br>作成日時: ${esc(json.exportedAt || '?')}`,
      '復元する', async () => {
        for (const s of STORES) {
          await idbClear(s);
          if (Array.isArray(json.data[s])) await idbBulkPut(s, json.data[s]);
        }
        await loadAll();
        toast('復元が完了しました');
        go('home');
      }, true);
  };
  reader.readAsText(file);
  input.value = '';
}

function ocrPickFile() {

async function ocrRun(file) {
  const area = document.getElementById('ocr-area');
  area.innerHTML = '<div class="okbox">📷 画像を読み取り中…(端末内処理・数秒〜数十秒)</div>';
  try {
    await loadTesseract();
    const bmp = await createImageBitmap(file);
    const cv = document.createElement('canvas');
    const maxW = 1600;
    const scale = Math.min(1, maxW / bmp.width);
    cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const dataUrl = cv.toDataURL('image/png');
    const ret = await Tesseract.recognize(dataUrl, 'jpn');
    const text = ret.data.text || '';
    const parsed = parseReceipt(text);
    if (parsed.amount) {
      document.getElementById('tx-amount').value = parsed.amount;
      if (parsed.date) document.getElementById('tx-date').value = parsed.date;
      if (parsed.shop) document.getElementById('tx-shop').value = parsed.shop.slice(0, 30);
      area.innerHTML = `<div class="okbox">読み取り結果をフォームに反映しました。内容を確認・修正してから登録してください。<br><span class="mut">店舗: ${esc(parsed.shop || '不明')} / 金額: ${fmtYen(parsed.amount)} / 信頼度: ${Math.round(ret.data.confidence)}%</span></div>`;
    } else {
      area.innerHTML = '<div class="errbox">金額を読み取れませんでした。手動で入力してください。(レシート全体が明るく写っていると認識率が上がります)</div>';
    }
  } catch (e) {
    area.innerHTML = `<div class="errbox">読み取りに失敗しました: ${esc(e.message || e)}<br>手動で入力してください。</div>`;
  }
}
function parseReceipt(text) {
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  // 日付
  let date = null;
  const dm = text.match(/(\d{4})[./\-年]\s*(\d{1,2})[./\-月]\s*(\d{1,2})/);
  if (dm) date = dm[1] + '-' + String(dm[2]).padStart(2, '0') + '-' + String(dm[3]).padStart(2, '0');
  // 金額: 「合計」「小計」「総合計」行の右側の数値を優先
  let amount = null;
  const num = s => { const m = String(s).match(/(\d[\d,，]*)/); return m ? Number(m[1].replace(/[,,，]/g, '')) : null; };
  for (const l of lines) {
    if (/合計|総合計|合 計/.test(l)) {
      const v = num(l.replace(/円/g, ''));
      if (v) amount = v;
    }
  }
  if (!amount) for (const l of lines) {
    if (/小計/.test(l)) { const v = num(l); if (v) amount = v; }
  }
  if (!amount) { // 最大の金額を拾う(レシート末尾の合計が最大であることが多い)
    let best = 0;
    for (const l of lines) { const v = num(l); if (v && v > best && v < 10000000) best = v; }
    amount = best || null;
  }
  const shop = lines.find(l => !/^[¥¥￥\d\s,，.年月日/:.-]+$/.test(l)) || '';
  return { date, amount, shop: shop ? shop.replace(/[^\p{L}\p{N}ぁ-んァ-ヶ一-龠々ーa-zA-Z0-9 　]/gu, '').trim() : '' };
}
